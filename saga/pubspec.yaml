name: saga
description: "Audiobook player for Plex Media Server."
publish_to: 'none'

# versionName+versionCode. Bump both together with the CHANGELOG entry — the
# release workflow tags from this, and Android refuses a downgrade install.
version: 1.1.1+20

environment:
  sdk: ^3.10.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Audio
  just_audio: ^0.9.43
  audio_service: ^0.18.15
  audio_session: ^0.1.22

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.0.0

  # Local storage
  hive_flutter: ^1.1.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # State management
  flutter_riverpod: ^2.6.1

  # Image caching. flutter_cache_manager backs cached_network_image and is
  # named directly so sign-out can empty it — a transitive dep is not something
  # to call into on trust.
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # Utilities
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  share_plus: ^10.1.3
  file_picker: ^8.3.7
  package_info_plus: ^9.0.1

# Vendored fork of just_audio: its Android pipeline is patched with a Media3
# TeeAudioProcessor that taps the decoded PCM for the real-loudness visualizer
# (no RECORD_AUDIO permission). Re-vendor + re-apply the patch on just_audio bumps.
dependency_overrides:
  just_audio:
    path: third_party/just_audio

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/ic_launcher.png"
  adaptive_icon_background: "#1E1410"
  adaptive_icon_foreground: "assets/icons/ic_launcher_fg.png"
  adaptive_icon_monochrome: "assets/icons/ic_launcher_mono.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  # Bundled, not fetched. Saga makes no request to Google Fonts or any other
  # third party — the privacy claims in the README depend on this staying true.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
