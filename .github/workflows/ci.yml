name: CI

on:
  push:
    branches: [main]
    paths: ['saga/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['saga/**', '.github/workflows/ci.yml']

# CI only reads the tree. Stated explicitly so a fork PR can never inherit a
# writable default token — release.yml is the only workflow that needs write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saga
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - name: Run tests
        env:
          # The DST regression tests target Europe/Oslo boundaries.
          TZ: Europe/Oslo
        # Goldens are excluded: they're rasterized by the host's Skia/font stack
        # and are checked in from a developer machine, so they don't byte-match
        # this runner. See saga/dart_test.yaml.
        run: flutter test --exclude-tags golden
