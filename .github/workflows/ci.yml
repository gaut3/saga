name: CI

on:
  push:
    branches: [main]
    paths: ['saga/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['saga/**', '.github/workflows/ci.yml']

# CI only reads the tree. Stated explicitly so a fork PR can never inherit a
# writable default token — only release.yml and stats-snapshot.yml need write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saga
    steps:
      # Actions are pinned to a commit SHA, not a tag: a tag is a mutable
      # pointer its owner can move to any code at any time (tj-actions, 2025).
      # The trailing comment is what Dependabot reads to offer bumps — keep it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Pinned, not "latest stable": 3.50.0 arrived between beta 7 and
          # 1.2.0 and failed analyze on its material.dart deprecation. A release
          # is built with the Flutter its betas were tested on; move this in ci.yml,
          # release.yml and codeql.yml together as a deliberate upgrade.
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - name: Run tests
        env:
          # The DST regression tests target Europe/Oslo boundaries.
          TZ: Europe/Oslo
        # Goldens are excluded: they're rasterized by the host's Skia/font stack
        # and are checked in from a developer machine, so they don't byte-match
        # this runner. See saga/dart_test.yaml.
        run: flutter test --exclude-tags golden
