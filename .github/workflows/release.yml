name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saga
    steps:
      # SHA-pinned — see the note in ci.yml. This job matters most: it holds
      # the signing key. The APKs are built without it (Gradle signs them with
      # the debug key), and one step that runs only apksigner re-signs them:
      # the keystore is on disk and its passwords are in the environment for
      # that step alone, so no dependency's build script, test or Dart hook
      # ever runs within reach of them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the tag is checked against main below.
          fetch-depth: 0

      # A release is what main says it is. A tag that names another version
      # than pubspec.yaml, or sits on a commit main doesn't contain (the v2 or
      # ios worktree, a stray local branch), would otherwise be built, signed
      # and offered to every install that checks for updates.
      - name: Check the tag
        run: |
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pubspec.yaml's $version"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # 25, not 17: AGP 9.3's lint calls a JDK 21 API and crashes on 17
          # (lintVitalAnalyzeRelease). Same major as Android Studio's bundled JDK.
          java-version: '25'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Pinned, not "latest stable": 3.50.0 arrived between beta 7 and
          # 1.2.0 and failed analyze on its material.dart deprecation, so 1.2.0
          # shipped on 3.47.9. A release is built with the Flutter its betas were
          # tested on; move this in ci.yml, release.yml and codeql.yml together
          # as a deliberate upgrade (3.50.0: Material moved to package:material_ui).
          flutter-version: 3.50.0
          # No cache here: a cache is written by other runs, and this is the
          # job that signs. A release is rare enough to download its SDK.

      # The committed lockfile, exactly: a release must not resolve to a
      # dependency version no one has built or tested.
      - run: flutter pub get --enforce-lockfile

      - run: flutter analyze

      - name: Run tests
        env:
          # The DST regression tests target Europe/Oslo boundaries.
          TZ: Europe/Oslo
        run: flutter test

      # No keystore and no passwords here: build.gradle.kts falls back to the
      # debug key and says so in the log. The signing step below replaces
      # that signature.
      - name: Build release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      # arm64-only APK for IzzyOnDroid (their repo has a ~30 MB per-app
      # budget; the universal APK is ~50 MB). saga.apk stays the headline
      # asset for direct downloads.
      - name: Build arm64-only APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols --split-per-abi --target-platform android-arm64

      # The only step that touches the signing key, and it runs nothing but
      # apksigner. Output goes to dist/ under the stable filenames.
      - name: Sign the APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keystore="$RUNNER_TEMP/keystore.jks"
          trap 'rm -f "$keystore"' EXIT
          echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          mkdir -p dist
          sign() {
            "$apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --out "dist/$2" "build/app/outputs/flutter-apk/$1"
          }
          sign app-release.apk saga.apk
          sign app-arm64-v8a-release.apk saga-arm64-v8a.apk
          rm -f dist/*.idsig

      # What gets published must carry Saga's own certificate: the one every
      # installed copy was signed with, and the only one Android accepts as
      # an update to it. The fingerprint is public (it is in every APK, and
      # in the README under "To check a download").
      - name: Check the signing certificate
        env:
          EXPECTED_SHA256: aebf195e125b791faaa3f93517964be7fa04a7bc282dbeae588c335eb2202242
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          for apk in dist/saga.apk dist/saga-arm64-v8a.apk; do
            # Every signer apksigner names, whatever it calls them: "Signer
            # #1" or, from some versions, "Signer (minSdkVersion=…)". The
            # first tag run with build-tools 37 matched no line under the
            # "#1" form alone. One distinct digest must come out, and it
            # must be Saga's: a second signer makes two lines and fails.
            certs="$("$apksigner" verify --print-certs "$apk")"
            actual="$(printf '%s\n' "$certs" \
              | sed -n 's/^Signer .*certificate SHA-256 digest: //p' | sort -u)"
            if [ "$actual" != "$EXPECTED_SHA256" ]; then
              # Certificates are public; this is what says why it failed.
              printf '%s\n' "$certs"
              echo "::error::$apk is signed with '$actual', not Saga's certificate"
              exit 1
            fi
            echo "$apk: $actual"
          done

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum saga.apk > saga.apk.sha256
          sha256sum saga-arm64-v8a.apk > saga-arm64-v8a.apk.sha256
          cat *.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: saga/dist/*.apk

      - name: Extract changelog section
        run: awk '/^## /{n++; next} n==1' ../CHANGELOG.md > ../RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: RELEASE_NOTES.md
          # A hyphenated tag (v2.0.0-beta.1) is a beta: a pre-release, never
          # "Latest" — the in-app updater reads releases/latest, so a beta
          # published as latest would be offered to every stable user.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          # Releases are immutable: no files can be added once one is
          # published. The action uploads a release's files while it is still
          # a draft, but publishes a pre-release first, so v1.2.0-beta.1 went
          # out with no APK. A beta stays a draft here and is published below.
          draft: ${{ contains(github.ref_name, '-') }}
          files: |
            saga/dist/saga.apk
            saga/dist/saga.apk.sha256
            saga/dist/saga-arm64-v8a.apk
            saga/dist/saga-arm64-v8a.apk.sha256

      - name: Publish the beta
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
